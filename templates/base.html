<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block meta_description %}zuirx share — compartilhe sua tela em tempo real com qualquer pessoa.{% endblock %}" />
  <title>{% block title %}zuirx share{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="app-wrapper">
    {% block content %}{% endblock %}
  </div>
  <script src="{{ url_for('static', filename='js/error-modal.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
